        ul { list-style: none; margin-top: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; align-items: start; }

                bgMusic.play();

        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        loginBtn.addEventListener('click', async () => {
            const pwd = passwordInput.value.trim();
            if(!pwd) { alert("اكتب كلمة مرور الأول يا هندسة!"); return; }
            
            loginBtn.innerText = "⏳ جاري الدخول...";
            loginBtn.disabled = true;

            userHash = await sha256(pwd); 
            localStorage.setItem('userHash', userHash);
            
            notesRef = dbRef(db, `users_data/${userHash}/notes`);

            startReminderChecker();

            localStorage.removeItem('userHash');
            location.reload(); 
        });

        closeModal.addEventListener('click', () => { noteModal.style.display = 'none'; });
        window.addEventListener('click', (e) => { if(e.target === noteModal) noteModal.style.display = 'none'; });

        const colorCircles = document.querySelectorAll('.color-circle');
        colorCircles.forEach(circle => {
            circle.addEventListener('click', (e) => {
                colorCircles.forEach(c => c.classList.remove('active'));
                e.target.classList.add('active');
                selectedNoteColor = e.target.getAttribute('data-color');
            });

        function resetColorPalette() {

            document.querySelector('.color-circle[data-color="default"]').classList.add('active');
            selectedNoteColor = 'default';
        }

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            document.querySelectorAll('#notesList li').forEach(li => {
                const titleDiv = li.querySelector('.note-title-display');
                const contentDiv = li.querySelector('.note-content');
                const titleText = titleDiv ? titleDiv.innerText.toLowerCase() : '';
                const contentText = contentDiv ? contentDiv.innerText.toLowerCase() : '';
                li.style.display = (titleText.includes(searchTerm) || contentText.includes(searchTerm)) ? 'flex' : 'none';
            });
        });

        scoreInput.addEventListener('input', function() { scoreDisplay.innerText = this.value + '%'; });

        addNewFolderBtn.addEventListener('click', async () => {
            const folderName = prompt("اكتب اسم المجلد الجديد:");
            if(folderName && folderName.trim() !== '') {
                await push(foldersRef, { name: folderName.trim() });
            }
        });

        function loadFolders() {
            onValue(foldersRef, (snapshot) => {
                const data = snapshot.val();
                allFoldersArray = data ? Object.keys(data).map(k => ({ id: k, name: data[k].name })) : [];
                
                foldersListDisplay.innerHTML = `
                    <div class="folder-chip ${currentFolderFilter === 'all' ? 'active' : ''}" data-id="all">🌐 الكل</div>
                    <div class="folder-chip ${currentFolderFilter === 'general' ? 'active' : ''}" data-id="general">📁 عام</div>
                `;
                
                folderSelect.innerHTML = `<option value="general">📁 عام</option>`;

                allFoldersArray.forEach(folder => {
                    const chip = document.createElement('div');
                    chip.className = `folder-chip ${currentFolderFilter === folder.id ? 'active' : ''}`;
                    chip.dataset.id = folder.id;
                    chip.innerHTML = `
                        📁 ${escapeHTML(folder.name)}
                        <div class="folder-actions">
                            <button class="folder-btn edit-folder" data-id="${folder.id}" data-name="${escapeHTML(folder.name)}" title="تعديل">✏️</button>
                            <button class="folder-btn del-folder" data-id="${folder.id}" title="حذف">🗑️</button>
                        </div>
                    `;
                    foldersListDisplay.appendChild(chip);

                    const option = document.createElement('option');
                    option.value = folder.id;
                    option.innerText = `📁 ${folder.name}`;
                    folderSelect.appendChild(option);
                });

                document.querySelectorAll('.folder-chip').forEach(chip => {
                    chip.addEventListener('click', (e) => {
                        if(e.target.closest('.folder-actions')) return; 
                        currentFolderFilter = chip.dataset.id;
                        document.querySelectorAll('.folder-chip').forEach(c => c.classList.remove('active'));
                        chip.classList.add('active');
                        renderNotes(); 
                    });
                });

                document.querySelectorAll('.edit-folder').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.dataset.id;
                        const oldName = e.target.dataset.name;
                        const newName = prompt("تعديل اسم المجلد:", oldName);
                        if(newName && newName.trim() !== '' && newName !== oldName) {
                            await update(dbRef(db, `users_data/${userHash}/folders/${id}`), { name: newName.trim() });
                        }
                    });
                });

                document.querySelectorAll('.del-folder').forEach(btn => {
                    btn.addEventListener('click', async (e) => {
                        const id = e.target.dataset.id;
                        if(confirm("متأكد إنك عايز تحذف المجلد ده؟ (الملاحظات اللي جواه هتتنقل لـ 'عام')")) {
                            allNotesArray.forEach(note => {
                                if(note.folderId === id) {
                                    update(dbRef(db, `users_data/${userHash}/notes/${note.id}`), { folderId: 'general' });
                                }
                            });
                            await remove(dbRef(db, `users_data/${userHash}/folders/${id}`));
                            if(currentFolderFilter === id) { currentFolderFilter = 'all'; }
                        }
                    });
                });
            });
        }

        enableNotificationsBtn.addEventListener('click', () => {
            if ("Notification" in window) {
                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        alert("عاش! الإشعارات اتفعلت وهيوصلك تنبيه في ميعاد الملاحظة.");
                        enableNotificationsBtn.innerText = "✔️ الإشعارات مفعلة";
                        enableNotificationsBtn.style.background = "#1dd1a1";
                        enableNotificationsBtn.style.color = "white";
                        enableNotificationsBtn.style.borderColor = "#1dd1a1";
                    } else {
                        alert("لازم توافق على صلاحية الإشعارات من المتصفح عشان المنبه يشتغل!");
                    }
                });
            } else {
                alert("المتصفح بتاعك مش بيدعم الإشعارات للأسف.");
            }
        });

        function playAlarmSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'square'; 
                oscillator.frequency.value = 800; 
                gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.5);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 1.5);
            } catch(e) { console.log("الصوت مش مدعوم:", e); }
        }

        function startReminderChecker() {
            setInterval(() => {
                if(Notification.permission !== "granted") return;
                const now = new Date().getTime();
                
                allNotesArray.forEach(note => {
                    if (note.reminderTime && !note.notified) {
                        const remTime = new Date(note.reminderTime).getTime();
                        if (now >= remTime) {
                            new Notification("⏰ تنبيه من ملاحظاتي", {
                                body: note.title || "حان موعد تذكير إحدى الملاحظات!",
                                icon: "./icon-192.png"
                            });
                            playAlarmSound();
                            update(dbRef(db, `users_data/${userHash}/notes/${note.id}`), { notified: true });
                        }
                    }
                });
            }, 10000); 
        }

        exportBtn.addEventListener('click', async () => {
            try {
                exportBtn.innerText = '⏳ جاري التصدير...';
                const snapshot = await get(notesRef);
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const jsonString = JSON.stringify(data, null, 2);
                    const blob = new Blob([jsonString], { type: "application/json" });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `notes_backup_${new Date().toISOString().split('T')[0]}.json`;
                    a.click();
                    URL.revokeObjectURL(url);
                } else { alert("مفيش ملاحظات لتصديرها حالياً!"); }
            } catch (error) { alert("حصل خطأ أثناء التصدير."); } finally { exportBtn.innerText = '📥 تصدير نسخة (Backup)'; }
        });

        importBtn.addEventListener('click', () => importInput.click());
        importInput.addEventListener('change', async (e) => {
            const files = e.target.files;
            if (files.length === 0) return;
            importBtn.innerText = '⏳ جاري الاستيراد...';
            importBtn.disabled = true;
            let importCount = 0;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const text = await file.text();
                    const importedData = JSON.parse(text);

                    if (importedData.textContent !== undefined || importedData.listContent !== undefined) {
                        if (importedData.isTrashed) continue; 
                        let content = importedData.textContent || '';
                        if (importedData.listContent) content = importedData.listContent.map(item => (item.isChecked ? '✅ ' : '❌ ') + item.text).join('\n');
                        let color = 'default';
                        if(importedData.color === 'RED') color = 'red';
                        if(importedData.color === 'BLUE' || importedData.color === 'TEAL') color = 'blue';
                        if(importedData.color === 'YELLOW') color = 'yellow';
                        if(importedData.color === 'GREEN') color = 'green';

                        let dateString = new Date().toLocaleDateString('ar-EG');
                        let sortOrderValue = -new Date().getTime();
                        if (importedData.userEditedTimestampUsec) {
                            const keepDate = new Date(importedData.userEditedTimestampUsec / 1000);
                            dateString = `${keepDate.toLocaleDateString('ar-EG')} - الساعة ${keepDate.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' })}`;
                            sortOrderValue = -(importedData.userEditedTimestampUsec / 1000);
                        }

                        await push(notesRef, {
                            title: importedData.title || '', content: content, timestamp: dateString, score: 50, color: color,
                            isPinned: importedData.isPinned || false, sortOrder: sortOrderValue, imageUrls: [], audioUrl: null,
                            folderId: 'general'
                        });
                        importCount++;
                    } else {
                        let notesToImport = [];
                        if (Array.isArray(importedData)) notesToImport = importedData;
                        else if (typeof importedData === 'object') notesToImport = Object.values(importedData);

                        for (let note of notesToImport) {
                            await push(notesRef, {
                                title: note.title || '', content: note.content || '', timestamp: note.timestamp || new Date().toLocaleDateString('ar-EG'),
                                score: note.score || 50, color: note.color || 'default', isPinned: note.isPinned || false,
                                sortOrder: note.sortOrder || -new Date().getTime(), imageUrl: note.imageUrl || null, imageUrls: note.imageUrls || [], 
                                audioUrl: note.audioUrl || null, folderId: note.folderId || 'general', reminderTime: note.reminderTime || null, notified: note.notified || false
                            });
                            importCount++;
                        }
                    }
                } catch (err) { console.error("متجاهل الملف ده عشان صيغته مش مفهومة:", file.name); }
            }
            if(importCount > 0) alert(`عاش! تم استيراد ${importCount} ملاحظة بنجاح.`);
            else alert("ملقيناش بيانات صالحة للاستيراد في الملفات دي.");
            importInput.value = ''; importBtn.innerText = '📤 استيراد (Keep / Backup)'; importBtn.disabled = false;
        });

        uploadImgBtn.addEventListener('click', () => { if(!editingNoteId) imageInput.click(); else alert("لا يمكن تغيير الصور أثناء وضع التعديل."); });
        imageInput.addEventListener('change', (e) => {
            selectedImageFiles = Array.from(e.target.files);
            if(selectedImageFiles.length > 0) imgStatus.innerText = `✔️ تم إرفاق ${selectedImageFiles.length} صورة/صور`;

        });

        recordAudioBtn.addEventListener('click', async () => {
            if(editingNoteId) { alert("لا يمكن تسجيل صوت أثناء وضع التعديل."); return; }
            if (!isRecording) {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream); mediaRecorder.start(); isRecording = true;
                    recordAudioBtn.innerText = '🛑 إيقاف التسجيل'; recordAudioBtn.classList.add('recording'); audioChunks = [];
                    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
                    mediaRecorder.onstop = () => { recordedAudioBlob = new Blob(audioChunks, { type: 'audio/webm' }); audioStatus.innerText = '✔️ تم إرفاق تسجيل صوتي'; };
                } catch (err) { alert('يجب الموافقة على صلاحية المايكروفون!'); }
            } else { mediaRecorder.stop(); isRecording = false; recordAudioBtn.innerText = '🎤 تسجيل صوتي'; recordAudioBtn.classList.remove('recording'); }
        });

        addBtn.addEventListener('click', async () => {
            const title = noteTitleInput.value.trim();
            const text = noteInput.value.trim();
            const scoreValue = scoreInput.value;
            const selectedFolderId = folderSelect.value;
            const reminderVal = reminderInput.value;

            if (title !== '' || text !== '' || selectedImageFiles.length > 0 || recordedAudioBlob) {
                try {
                    if (editingNoteId) {
                        const now = new Date();
                        const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                        const dateString = now.toLocaleDateString('ar-EG');
                        
                        let updateData = {
                            title: title, content: text, score: scoreValue, color: selectedNoteColor, folderId: selectedFolderId,
                            timestamp: `${dateString} - الساعة ${timeString} (مُعدلة)`
                        };
                        
                        if(reminderVal) { updateData.reminderTime = reminderVal; updateData.notified = false; }
                        else { updateData.reminderTime = null; }

                        await update(dbRef(db, `users_data/${userHash}/notes/${editingNoteId}`), updateData);
                        editingNoteId = null; addBtn.classList.remove('edit-mode');
                    } 
                    else {
                        addBtn.innerText = `⏳ جاري الحفظ والرفع...`; addBtn.disabled = true;
                        let finalImageUrls = []; let audioUrl = null;

                        if (selectedImageFiles.length > 0) {
                            const uploadPromises = selectedImageFiles.map(async (file) => {
                                const imgFileRef = storageRef(storage, `uploads/${userHash}/images/${Date.now()}_${file.name}`);
                                await uploadBytes(imgFileRef, file); return await getDownloadURL(imgFileRef);
                            });
                            finalImageUrls = await Promise.all(uploadPromises);
                        }

                        if (recordedAudioBlob) {
                            const audioFileRef = storageRef(storage, `uploads/${userHash}/audio/record_${Date.now()}.webm`);
                            await uploadBytes(audioFileRef, recordedAudioBlob); audioUrl = await getDownloadURL(audioFileRef);
                        }

                        const now = new Date();
                        const timeString = now.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
                        const dateString = now.toLocaleDateString('ar-EG');

                        await push(notesRef, {
                            title: title, content: text, timestamp: `${dateString} - الساعة ${timeString}`, score: scoreValue, 
                            color: selectedNoteColor, isPinned: false, sortOrder: -now.getTime(), imageUrls: finalImageUrls, audioUrl: audioUrl,
                            folderId: selectedFolderId, reminderTime: reminderVal || null, notified: false
                        });
                    }
                    resetInputs();
                } catch (error) { console.error("حدث خطأ:", error); alert("حصل مشكلة أثناء الحفظ! تأكد من النت."); } 
                finally { addBtn.innerText = 'إضافة الملاحظة ✨'; addBtn.disabled = false; }
            } else { alert("اكتب عنوان أو محتوى للملاحظة عشان تتحفظ!"); }
        });

        function resetInputs() {
            noteTitleInput.value = ''; noteInput.value = ''; scoreInput.value = 50; scoreDisplay.innerText = '50%';
            selectedImageFiles = []; recordedAudioBlob = null; imageInput.value = ''; imgStatus.innerText = ''; audioStatus.innerText = '';
            reminderInput.value = ''; 
            resetColorPalette();
        }

        function generateMediaHTML(noteData) {
            let html = ''; let allImages = [];
            if(noteData.imageUrl) allImages.push(noteData.imageUrl);
            if(noteData.imageUrls && noteData.imageUrls.length > 0) allImages = allImages.concat(noteData.imageUrls);
            if (allImages.length === 1) html += `<img src="${allImages[0]}" class="single-image" alt="مرفق صورة">`;
            else if (allImages.length > 1) { html += `<div class="image-gallery">`; allImages.forEach(url => { html += `<img src="${url}" class="note-image" alt="مرفق صورة">`; }); html += `</div>`; }
            if (noteData.audioUrl) html += `<audio controls src="${noteData.audioUrl}" class="note-audio"></audio>`;
            return html;
        }

        function openNoteModal(noteData) {
            if(noteData.color && noteData.color !== 'default') modalCard.setAttribute('data-color', noteData.color); else modalCard.removeAttribute('data-color');
            const mediaHTML = generateMediaHTML(noteData);
            let reminderTxt = '';
            if(noteData.reminderTime) {
                const rDate = new Date(noteData.reminderTime);
                reminderTxt = `<span class="reminder-badge">⏰ تذكير: ${rDate.toLocaleString('ar-EG')}</span>`;
            }
            modalBody.innerHTML = `
                ${noteData.title ? `<div class="note-title-display">${escapeHTML(noteData.title)}</div>` : ''}
                ${mediaHTML}
                ${noteData.content ? `<div class="note-content">${escapeHTML(noteData.content)}</div>` : ''}
                <div class="note-meta" style="margin-top: 25px; padding-top: 20px; border-top: 2px dashed var(--border-color);">

                    ${reminderTxt}
                </div>

            noteModal.style.display = 'flex';
        }

        function loadNotes() {
            onValue(notesRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    allNotesArray = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                } else {
                    allNotesArray = [];
                }
                renderNotes(); 
            });
        }

        function renderNotes() {
            notesList.innerHTML = '';
            let filteredNotes = allNotesArray.filter(note => currentFolderFilter === 'all' || (note.folderId || 'general') === currentFolderFilter);

            filteredNotes.sort((a, b) => {
                if (a.isPinned && !b.isPinned) return -1;
                if (!a.isPinned && b.isPinned) return 1;
                return a.sortOrder - b.sortOrder;
            });

            filteredNotes.forEach(note => {
                const li = document.createElement('li');
                if(note.isPinned) li.classList.add('pinned-note');
                if(note.color && note.color !== 'default') li.setAttribute('data-color', note.color);
                
                li.draggable = true;
                li.addEventListener('dragstart', function() { draggedId = note.id; draggedSortOrder = note.sortOrder; this.style.opacity = '0.5'; });
                li.addEventListener('dragover', e => e.preventDefault());
                li.addEventListener('drop', function(e) {
                    e.preventDefault(); this.style.opacity = '1';
                    if(draggedId && draggedId !== note.id) {
                        update(dbRef(db, `users_data/${userHash}/notes/${draggedId}`), { sortOrder: note.sortOrder });
                        update(dbRef(db, `users_data/${userHash}/notes/${note.id}`), { sortOrder: draggedSortOrder });
                    }
                });
                li.addEventListener('dragend', function() { this.style.opacity = '1'; });

                li.addEventListener('click', (e) => {
                    if(e.target.tagName.toLowerCase() === 'button' || e.target.closest('button')) return;
                    openNoteModal(note);
                });

                const mediaHTML = generateMediaHTML(note);
                const copyText = (note.title ? note.title + '\n\n' : '') + (note.content || '');

                let reminderTxt = '';
                if(note.reminderTime) {
                    const rDate = new Date(note.reminderTime);
                    reminderTxt = `<span class="reminder-badge" title="منبه مفعل">⏰ ${rDate.toLocaleTimeString('ar-EG', {hour:'2-digit', minute:'2-digit'})}</span>`;
                }

                li.innerHTML = `
                    ${note.title ? `<div class="note-title-display">${escapeHTML(note.title)}</div>` : ''}
                    ${mediaHTML}
                    ${note.content ? `<div class="note-content">${escapeHTML(note.content)}</div>` : ''}
                    <div class="note-footer">
                        <div class="note-meta">
                            <span>🕒 ${note.timestamp}</span>
                            <span class="score-badge">⭐ ${note.score ? note.score+'%' : 'بدون تقييم'}</span>
                            ${reminderTxt}
                        </div>
                        <div class="action-buttons">
                            <button class="copy-btn" data-content="${escapeHTML(copyText)}">📋 نسخ</button>
                            <button class="pin-btn ${note.isPinned ? 'active' : ''}" data-id="${note.id}" data-pinned="${note.isPinned || false}">${note.isPinned ? 'إلغاء' : 'تثبيت'}</button>
                            <button class="edit-btn" data-id="${note.id}" data-title="${escapeHTML(note.title || '')}" data-content="${escapeHTML(note.content || '')}" data-score="${note.score || 50}" data-color="${note.color || 'default'}" data-folder="${note.folderId || 'general'}" data-reminder="${note.reminderTime || ''}">تعديل</button>
                            <button class="delete-btn" data-id="${note.id}">حذف</button>
                        </div>
                    </div>
                `;
                notesList.appendChild(li);
            });

            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const textToCopy = e.target.getAttribute('data-content');
                    if(textToCopy) {
                        navigator.clipboard.writeText(textToCopy).then(() => {
                            const originalText = e.target.innerText; e.target.innerText = '✔️ تم النسخ'; e.target.style.background = '#20c997'; e.target.style.color = 'white';
                            setTimeout(() => { e.target.innerText = originalText; e.target.style.background = ''; e.target.style.color = ''; }, 2000);
                        }).catch(err => alert("حدث خطأ أثناء النسخ."));
                    } else alert("لا يوجد نص لنسخه!");
                });
            });

            document.querySelectorAll('.pin-btn').forEach(btn => {
                btn.addEventListener('click', (e) => { update(dbRef(db, `users_data/${userHash}/notes/${e.target.dataset.id}`), { isPinned: !(e.target.dataset.pinned === 'true') }); });
            });

            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    editingNoteId = e.target.dataset.id;
                    noteTitleInput.value = e.target.dataset.title !== 'undefined' ? e.target.dataset.title : '';
                    noteInput.value = e.target.dataset.content !== 'undefined' ? e.target.dataset.content : '';
                    scoreInput.value = e.target.dataset.score; scoreDisplay.innerText = scoreInput.value + '%';
                    
                    folderSelect.value = e.target.dataset.folder;
                    reminderInput.value = e.target.dataset.reminder; 

                    const savedColor = e.target.dataset.color;
                    colorCircles.forEach(c => c.classList.remove('active'));
                    document.querySelector(`.color-circle[data-color="${savedColor}"]`).classList.add('active');
                    selectedNoteColor = savedColor;
                    
                    addBtn.innerText = 'حفظ التعديلات ✨'; addBtn.classList.add('edit-mode');
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const idToDel = e.target.dataset.id; remove(dbRef(db, `users_data/${userHash}/notes/${idToDel}`));
                    if(editingNoteId === idToDel) { editingNoteId = null; resetInputs(); addBtn.innerText = 'إضافة الملاحظة ✨'; addBtn.classList.remove('edit-mode'); }
                });
            });
        }

        function escapeHTML(str) {
            if(!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag]));
        }
    </script>
